<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
  .a{transform-box:fill-box;transform-origin:center;animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,1,.36,1)}
  .bg{animation:pop .8s cubic-bezier(.22,1,.36,1) both;transform-box:view-box;transform-origin:627px 627px}
  .band{animation:drop .8s .25s both}
  .cupL{animation:inL .7s .5s both}
  .cupR{animation:inR .7s .5s both}
  .barL{animation:grow .6s .8s both}
  .barR{animation:grow .6s .9s both}
  .m{animation:mpop .8s 1.1s both;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
  .glow{animation:glint 1s 1.7s both}
  @keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes drop{from{transform:translateY(-140px);opacity:0}to{transform:none;opacity:1}}
  @keyframes inL{from{transform:translateX(-160px);opacity:0}to{transform:none;opacity:1}}
  @keyframes inR{from{transform:translateX(160px);opacity:0}to{transform:none;opacity:1}}
  @keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
  @keyframes mpop{from{transform:scale(.5) translateY(30px);opacity:0}to{transform:none;opacity:1}}
  @keyframes glint{0%{opacity:0;transform:translateX(-1300px) skewX(-20deg)}30%{opacity:.35}100%{opacity:0;transform:translateX(1300px) skewX(-20deg)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
  <defs>
    <clipPath id="clip"><rect width="1254" height="1254" rx="282" ry="282"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A66FF"/>
      <stop offset="1" stop-color="#0050F5"/>
    </linearGradient>
  </defs>
  <g class="bg"><rect width="1254" height="1254" rx="282" ry="282" fill="url(#bg)"/>
  <g clip-path="url(#clip)"><rect class="glow" x="0" y="-100" width="260" height="1454" fill="#fff" opacity="0"/></g></g>
  <g fill="#FFFFFF" transform="translate(627 627) scale(1.2) translate(-627 -617)">
    <!-- headband -->
    <path class="a band" d="M294 581 C294 400 440 262 627 262 C814 262 958 400 958 581 Q940 577 912 577 C897 577 891 568 889 555 C878 440 775 338 627 338 C479 338 375 440 364 555 C362 568 356 577 342 577 L320 577 Q306 577 294 581 Z"/>
    <!-- outer ear cups -->
    <path class="a cupL" d="M281 607 C235 616 206 655 206 700 L206 822 C206 868 235 905 281 914 Z"/>
    <path class="a cupR" d="M973 607 C1019 616 1048 655 1048 700 L1048 822 C1048 868 1019 905 973 914 Z"/>
    <!-- inner bars -->
    <rect class="a barL" x="306" y="596" width="61" height="334" rx="20"/>
    <rect class="a barR" x="887" y="596" width="61" height="334" rx="20"/>
    <!-- M -->
    <path class="a m" d="M402 516 C402 500 412 490 428 490 C445 490 458 497 468 505 L612 625 C622 634 633 634 642 626 L788 505 C800 495 815 490 830 490 C845 490 852 502 852 516 L852 950 C852 962 845 972 832 972 C828 972 824 971 820 969 C790 956 760 938 760 905 L760 688 C760 676 752 672 745 672 C738 672 735 674 728 680 L665 728 C645 744 610 750 590 735 L520 680 C512 673 507 672 502 672 C496 672 494 678 494 688 L494 905 C494 938 465 956 435 969 C430 971 427 972 423 972 C410 972 402 962 402 950 Z"/>
  </g>
</svg>
