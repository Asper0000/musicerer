[package]
name = "musicerer"
version = "0.3.2"
edition = "2021"
rust-version = "1.95"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true


[dependencies]
mp4ameta = "0.13.0"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "tokio", "svg", "advanced", "image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "ico"] }
audiotags = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system", "disk"] }
tempfile = "3.27.0"
rfd = "0.18.0"
dirs = "7.0.0"
url = "2.5.8"
ureq = { version = "3.5.2", features = ["json"] }
sha2 = "0.11.1"
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Linux needs a windowing backend; default-features = false above drops iced's X11/Wayland
# support, which leaves softbuffer with no backend and the build fails.
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["x11", "wayland"] }

[build-dependencies]
winres = "0.1.12"
