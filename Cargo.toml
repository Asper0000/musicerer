[package]
name = "musicerer"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "tokio", "svg", "advanced", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
audiotags = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
tempfile = "3"
rfd = "0.15"
dirs = "6"
url = "2"
ureq = { version = "2.10", features = ["json"] }
[build-dependencies]
winres = "0.1"
