[package]
name = "musicerer"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[features]
# Embeds yt-dlp, ffmpeg, ffprobe, deno and soundcloud (from ./tools) into the exe. Windows only.
bundled = []

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "tokio", "svg", "advanced", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico"] }
audiotags = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
tempfile = "3"
rfd = "0.15"
dirs = "6"
url = "2"
ureq = { version = "2.10", features = ["json"] }

# Linux needs a windowing backend; `default-features = false` above drops iced's X11/Wayland
# support, which leaves softbuffer with no backend and the build fails.
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["x11", "wayland"] }

[build-dependencies]
winres = "0.1"
